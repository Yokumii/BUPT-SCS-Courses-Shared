# ===================================
# 协议栈服务配置文件 v1
# ===================================

[Network]
# 协议栈绑定的IP地址。
# - 推荐使用具体的IP地址以增强安全性。
# - 设为 0.0.0.0 可监听所有网络接口。
bind_ip = 192.168.1.100

# 协议栈绑定的端口号。
# - 请确保此端口未被其他应用程序占用。
bind_port = 8080

# 数据传输使用的承载协议。
# - tcp: 提供可靠的、面向连接的传输。
# - udp: 提供高速但不可靠的数据报传输。
protocol = tcp

[Device]
# 设备的唯一ID，必须为64位无符号长整数。
# - 此ID用于在网络中唯一标识本设备。
device_id = 1234567890123456

[Features]
# 是否启用CRC数据校验。
# - 当protocol为udp时，建议开启(true)以保证数据完整性。
# - 当protocol为tcp时，可关闭(false)，因为TCP协议自身已包含校验机制。
use_crc = true

# 心跳消息的发送时间间隔，单位为秒。
# - 用于维持连接和检测对端状态。
# - 用户要求3秒一次，故设为3。若不配置，默认为5秒。
heartbeat_interval = 3